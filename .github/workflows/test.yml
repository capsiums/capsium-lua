name: tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, Mondays 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  test:
    name: Lua Unit Tests (Busted)
    runs-on: ubuntu-latest

    strategy:
      matrix:
        lua-version: ['5.1', '5.2', '5.3', '5.4', 'luajit-2.1']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Lua ${{ matrix.lua-version }}
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua-version }}

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libzip-dev

      - name: Install dependencies from rockspec
        run: |
          luarocks make capsium-0.2.0-1.rockspec --only-deps

      - name: Install bit library for Lua 5.1 (SHA-256 fallback)
        if: ${{ matrix.lua-version == '5.1' }}
        run: |
          luarocks install luabitop

      - name: Install test dependencies
        run: |
          luarocks install busted
          luarocks install luacov

      - name: Run Busted tests
        run: |
          busted --verbose --coverage

      - name: Generate coverage report
        run: |
          luacov
          cat luacov.report.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.lua-version }}
          path: |
            luacov.report.out
            luacov.stats.out
        if: always()

  luacheck:
    name: Luacheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up LuaJIT
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: 'luajit-2.1'

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install luacheck
        run: |
          luarocks install luacheck

      - name: Run luacheck
        run: |
          luacheck lib lua test
