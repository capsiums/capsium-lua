# Capsium Nginx Configuration

# Initialize the Capsium reactor once at startup
init_by_lua_block {
    local capsium = require "capsium"

    local ok, err = capsium.init({
        config_path = os.getenv("CAPSIUM_CONFIG_PATH")
    })
    if not ok then
        ngx.log(ngx.ERR, "Failed to initialize Capsium: ", err)
    end
}

# Capsium package server
server {
    listen 80;
    server_name localhost;

    # Root directory for static files (welcome page)
    root /var/lib/capsium/static;

    # Welcome page (exact match only; everything else goes through Lua)
    location = / {
        try_files /index.html =404;
    }

    # Reserved introspection API prefix
    location /api/v1/introspect {
        content_by_lua_block {
            require "capsium".handle_introspection()
        }
    }

    # Generic Capsium handler: mounts are resolved from config.json
    # (Host + path prefix) and /capsium/<package-name> auto-mounts
    location / {
        content_by_lua_block {
            require "capsium".handle_request()
        }
    }
}
