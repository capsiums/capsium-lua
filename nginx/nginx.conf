user  nobody;
worker_processes  auto;

error_log  /dev/stderr notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /dev/stdout main;

    sendfile        on;

    keepalive_timeout  65;

    # Lua module search order (no overlapping module names between trees):
    #   1. LuaRocks tree — capsium core: capsium.utils, capsium.package.*,
    #      capsium.adapters.*, capsium.reactor, capsium.mime, capsium.csv
    #   2. OpenResty lualib — resty.* (sha256, string, ...)
    #   3. /etc/nginx/lua — ngx glue: capsium (init), capsium.config
    lua_package_path "/usr/local/openresty/luajit/share/lua/5.1/?.lua;/usr/local/openresty/luajit/share/lua/5.1/?/init.lua;/usr/local/openresty/lualib/?.lua;/usr/local/openresty/site/lualib/?.lua;/etc/nginx/lua/?.lua;/etc/nginx/lua/?/init.lua;;";
    lua_package_cpath "/usr/local/openresty/lualib/?.so;/usr/local/openresty/site/lualib/?.so;;";

    # Shared memory for introspection response caching (TTL from config.json)
    lua_shared_dict capsium_cache 10m;

    # DNS for Lua cosocket HTTP clients (OAuth2 token/userinfo calls,
    # section 4b): rendered from resolv.conf by the entrypoint
    include /tmp/capsium-resolver.conf;

    # Include Capsium configuration
    include /etc/nginx/conf.d/*.conf;
}
